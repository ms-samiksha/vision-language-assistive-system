{% extends 'base.html' %}

{% block content %}
<div class="page-container" style="max-width:640px;">
    <h1 class="page-title">
        <span class="page-title-icon">⚙</span> Settings
    </h1>

    <form method="POST">
        <!-- Vision level -->
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;margin-bottom:1rem;">
            <div class="form-group" style="margin-bottom:0;">
                <label for="vision_assistance_level">Vision Assistance Level</label>
                <select id="vision_assistance_level" name="vision_assistance_level" aria-describedby="vision-hint">
                    <option value="Standard"    {% if user.vision_assistance_level == 'Standard'    %}selected{% endif %}>Standard</option>
                    <option value="Low Vision"  {% if user.vision_assistance_level == 'Low Vision'  %}selected{% endif %}>Low Vision</option>
                    <option value="Fully Blind" {% if user.vision_assistance_level == 'Fully Blind' %}selected{% endif %}>Fully Blind</option>
                </select>
                <p id="vision-hint" style="margin-top:0.5rem;font-size:0.82rem;color:var(--text3);">
                    Adjusts caption verbosity and auto-speak defaults.
                </p>
            </div>
        </div>

        <!-- Speech -->
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;margin-bottom:1rem;">
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="auto_speak" name="auto_speak"
                           {% if user.auto_speak %}checked{% endif %}
                           aria-describedby="auto-speak-hint">
                    <label for="auto_speak">Auto-speak captions</label>
                </div>
                <p id="auto-speak-hint" style="margin-top:0.35rem;font-size:0.82rem;color:var(--text3);margin-left:2rem;">
                    Automatically read every new caption aloud via SAPI.
                </p>
            </div>

            <div class="form-group" style="margin-bottom:0;">
                <label for="speech_rate">
                    Speech Rate &nbsp;
                    <span id="rate-value" style="color:var(--amber);font-family:var(--font-mono);">{{ user.speech_rate }}</span>
                </label>
                <div style="display:flex;align-items:center;gap:1rem;max-width:400px;">
                    <span style="font-size:0.8rem;color:var(--text3);">Slower</span>
                    <input type="range" id="speech_rate" name="speech_rate"
                           min="140" max="190" value="{{ user.speech_rate }}"
                           style="flex:1;"
                           aria-valuemin="140" aria-valuemax="190" aria-valuenow="{{ user.speech_rate }}"
                           oninput="document.getElementById('rate-value').textContent=this.value;this.setAttribute('aria-valuenow',this.value)">
                    <span style="font-size:0.8rem;color:var(--text3);">Faster</span>
                </div>
            </div>
        </div>

        <!-- Important objects -->
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;margin-bottom:1.5rem;">
            <div class="form-group" style="margin-bottom:0;">
                <label for="important_objects">Important Objects</label>
                <input type="text" id="important_objects" name="important_objects"
                       value="{{ user.important_objects|join(', ') }}"
                       placeholder="phone, keys, wallet, glasses"
                       aria-describedby="obj-hint">
                <p id="obj-hint" style="margin-top:0.5rem;font-size:0.82rem;color:var(--text3);">
                    Comma-separated. These are auto-saved to memory whenever BLIP sees them.
                </p>
            </div>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width:100%;justify-content:center;">
            ✓ Save Changes
        </button>
    </form>
</div>
{% endblock %}
