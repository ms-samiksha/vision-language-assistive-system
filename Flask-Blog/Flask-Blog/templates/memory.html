{% extends 'base.html' %}

{% block content %}
<div class="page-container">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
        <h2>📝 Object Memory</h2>
        <button onclick="clearMemory()" class="btn btn-danger">Clear All</button>
    </div>

    <table class="memory-table">
        <thead>
            <tr>
                <th>Object</th>
                <th>Last Seen</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody>
            {% for memory in memories %}
            <tr>
                <td>{{ memory.object }}</td>
                <td>{{ memory.description }}</td>
                <td>{{ memory.timestamp }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="color:#555; font-style:italic;">No memories saved yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
