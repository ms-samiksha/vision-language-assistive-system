<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See & Tell</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="{{ 'mode-blind' if user and user.vision_assistance_level == 'Fully Blind' else 'mode-low-vision' if user and user.vision_assistance_level == 'Low Vision' else 'mode-standard' }}">

    <nav>
        <div class="logo">See & Tell</div>
        {% if user %}
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('memory') }}">Memory</a>
            <a href="{{ url_for('find') }}">Find</a>
            <a href="{{ url_for('settings') }}">Settings</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        // Pass user settings to JS
        window.USER_SETTINGS = {
            auto_speak: {{ 'true' if user and user.auto_speak else 'false' }},
            speech_rate: {{ user.speech_rate if user else 165 }},
            vision_mode: "{{ user.vision_assistance_level if user else 'Standard' }}"
        };
    </script>
</body>
</html>
