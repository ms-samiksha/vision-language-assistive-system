{% extends 'base.html' %}

{% block content %}
<div class="page-container">
    <h2>🔍 Find Object</h2>

    <form method="POST" class="find-form">
        <div class="form-group">
            <label for="object">What are you looking for?</label>
            <input type="text" id="object" name="object"
                   placeholder="e.g. keys, phone, glasses"
                   required autofocus autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-large">Find</button>
    </form>

    {% if result %}
    <div class="result-card">
        <p id="find-result-text">{{ result }}</p>
        <button onclick="speakFindResult()" class="btn btn-secondary">
            🔊 Read Result
        </button>
    </div>
    <script>
        function speakFindResult() {
            var text = document.getElementById('find-result-text').textContent;
            speakText(text, 0);
        }
    </script>
    {% endif %}
</div>
{% endblock %}
