{% extends 'base.html' %}

{% block content %}
<div class="page-container">
    <h2>Settings</h2>
    <form method="POST">
        <div class="form-group">
            <label for="vision_assistance_level">Vision Assistance Level</label>
            <select id="vision_assistance_level" name="vision_assistance_level">
                <option value="Standard" {% if user.vision_assistance_level == 'Standard' %}selected{% endif %}>Standard</option>
                <option value="Low Vision" {% if user.vision_assistance_level == 'Low Vision' %}selected{% endif %}>Low Vision</option>
                <option value="Fully Blind" {% if user.vision_assistance_level == 'Fully Blind' %}selected{% endif %}>Fully Blind</option>
            </select>
        </div>
        <div class="form-group checkbox-group">
            <label for="auto_speak">Auto Speak Captions</label>
            <input type="checkbox" id="auto_speak" name="auto_speak" {% if user.auto_speak %}checked{% endif %}>
        </div>
        <div class="form-group">
            <label for="speech_rate">Speech Rate (140-190)</label>
            <input type="range" id="speech_rate" name="speech_rate" min="140" max="190" value="{{ user.speech_rate }}">
        </div>
        <div class="form-group">
            <label for="important_objects">Important Objects</label>
            <input type="text" id="important_objects" name="important_objects" value="{{ user.important_objects|join(', ') }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
