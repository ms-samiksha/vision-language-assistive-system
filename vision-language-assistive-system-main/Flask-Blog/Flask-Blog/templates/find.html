{% extends 'base.html' %}

{% block content %}
<div class="page-container">
    <h2>Find Object</h2>
    
    <form method="POST" class="find-form">
        <div class="form-group">
            <label for="object">What are you looking for?</label>
            <input type="text" id="object" name="object" placeholder="e.g. keys" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-large">Find</button>
    </form>

    {% if result %}
    <div class="result-card">
        <p>{{ result }}</p>
        <button onclick="speakText('{{ result }}')" class="btn btn-secondary">Read Result</button>
    </div>
    {% endif %}
</div>
{% endblock %}
